# CERT-In 180-day audit_log retention sweep.
#
# Owner ADR: docs/adr/0015-cert-in-india-log-retention.md
# Retention constant: packages/db/src/schema/audit_log.ts (AUDIT_LOG_RETENTION_DAYS)
# Sweep script: scripts/audit-log-sweep.ts (see header for full design notes)
# ATIDs satisfied: AUDIT-002
#
# Schedule: daily at 03:00 UTC. Picked deliberately as a low-traffic window
# for ap-south-1 (08:30 IST). The script is idempotent — same-day re-runs
# (manual workflow_dispatch) delete zero rows.
#
# Required repository secrets:
#   DATABASE_URL — Supabase connection string for the production India
#                  (ap-south-1) project. MUST point at the writable role;
#                  the sweep is the ONLY DELETE the schema authorises.
#
# Optional secrets (future):
#   SLACK_WEBHOOK_URL — failure notification target. When configured,
#                       replace the `Notify on failure` placeholder step
#                       with a `curl -X POST` to the webhook. Today the
#                       placeholder is a no-op `echo` so the workflow
#                       remains valid until ops wires a channel.

name: audit-log-sweep

on:
  schedule:
    # 03:00 UTC every day. Cron is UTC on GitHub Actions.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this off-schedule?'
        required: false
        default: 'manual verification'

concurrency:
  # Never run two sweeps in parallel against the same DB.
  group: audit-log-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: CERT-In 180-day audit_log sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify DATABASE_URL is configured
        # Fail-fast in CI if the secret is missing rather than letting the
        # script fail later with an opaque error.
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is not set. CERT-In sweep cannot run."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CERT-In 180-day audit_log sweep
        working-directory: scripts
        run: bun run db:sweep-audit

      - name: Notify on failure
        if: failure()
        # Placeholder — replace with a real notification step when the
        # workspace wires Slack/PagerDuty/email. Keeps the workflow valid
        # today without introducing a hard dependency on a channel.
        run: |
          echo "::error::CERT-In audit_log sweep FAILED on ${GITHUB_RUN_ID}."
          echo "Workflow URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Owner ADR: docs/adr/0015-cert-in-india-log-retention.md"
