# DPDP §8(7) — daily erasure of resolved grievance contact PII.
#
# Owner ADR: docs/adr/0015-cert-in-india-log-retention.md (Phase 9 §3
#            amendment) + docs/action-plans/season-1/phase-9-deferred.md §3
# Retention constant: packages/db/src/schema/grievance_contacts.ts
#                     (GRIEVANCE_CONTACTS_ERASE_AFTER_DAYS = 30)
# Sweep script: scripts/grievance-contacts-sweep.ts
# Schema:       packages/db/drizzle/0005_dpdp_grievance_contacts.sql
#
# Schedule: daily at 03:30 UTC — ordered 30 minutes after audit-log-sweep
# so the two run sequentially on the same DB without contention. Same
# low-traffic window as audit-log-sweep (~09:00 IST).
#
# The script is idempotent — same-day re-runs (manual workflow_dispatch)
# delete zero rows once the day's quota is gone. Counsel sign-off on
# the 30-day post-resolve window is tracked at Phase 9 §3 in
# phase-9-deferred.md; if counsel amends the window,
# GRIEVANCE_CONTACTS_ERASE_AFTER_DAYS is the single point of change.
#
# Required repository secrets:
#   DATABASE_URL — Supabase connection string for the production
#                  ap-south-1 project. MUST point at the writable role;
#                  this sweep + the audit-log sweep are the only two
#                  DELETEs the citizen-PII schema authorises.

name: grievance-contacts-sweep

on:
  schedule:
    # 03:30 UTC daily — 30 minutes after audit-log-sweep.
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this off-schedule?'
        required: false
        default: 'manual verification'

concurrency:
  # Never run two sweeps in parallel against the same DB.
  group: grievance-contacts-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: DPDP §8(7) grievance_contacts erasure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify DATABASE_URL is configured
        # Fail-fast in CI if the secret is missing rather than letting
        # the script fail later with an opaque error.
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is not set. DPDP §8(7) sweep cannot run."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run DPDP §8(7) grievance_contacts sweep
        working-directory: scripts
        run: bun run db:sweep-grievance-contacts

      - name: Notify on failure
        if: failure()
        # Placeholder — same shape as audit-log-sweep. Replace with a
        # real Slack/PagerDuty/email step when ops wires the channel.
        run: |
          echo "::error::DPDP §8(7) grievance_contacts sweep FAILED on ${GITHUB_RUN_ID}."
          echo "Workflow URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Owner ADR: docs/adr/0015-cert-in-india-log-retention.md (Phase 9 §3 amendment)"
