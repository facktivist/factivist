# Weekly cost-analyst scorecard — re-runs the
# `dev_metrics.zkp_route_events` aggregation documented in
# `docs/architecture/phase-5/wave-2-auth.md` §"Cost-analyst hookup" and
# posts the result as a comment on the recurring scorecard issue.
#
# Origin: nice-to-have #8 from `pattern_s1_phase_5_done.md` — the SQL
# was documented but never automated. This cron threads it into the
# weekly [[s1-cost-drift]] cadence so a server-fallback spike trips a
# visible signal without a human running ad-hoc psql.
#
# Schedule: Sunday 07:00 UTC (~12:30 IST). Picked so the report is
# waiting in the issue tracker when the cost-analyst wakes on Monday.
#
# Output:
#   - stdout JSON captured into the workflow artifact `zkp-scorecard`
#   - one PR-style comment posted to the scorecard tracking issue
#     (configurable via `ZKP_COST_SCORECARD_ISSUE`, defaults to #116).
#
# Required repository secrets:
#   DATABASE_URL — Supabase read-only connection string. The SELECT
#                  query never touches mutating SQL; a read-only role
#                  is sufficient and recommended.
#
# Required repository variables (Settings → Variables → Repository):
#   ZKP_COST_SCORECARD_ISSUE — issue number to comment on. Default 116.

name: zkp-cost-scorecard

on:
  schedule:
    # Sunday 07:00 UTC.
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this off-schedule?'
        required: false
        default: 'manual scorecard refresh'

concurrency:
  group: zkp-cost-scorecard
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scorecard:
    name: zkp_route_events weekly aggregation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TELEMETRY_DISABLED: 1
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ZKP_COST_SCORECARD_ISSUE: ${{ vars.ZKP_COST_SCORECARD_ISSUE || '116' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify DATABASE_URL is configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is not set. Cost scorecard cannot run."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run weekly aggregation
        id: scorecard
        working-directory: scripts
        run: |
          set -o pipefail
          bun cost/zkp-route-events-weekly.ts | tee /tmp/zkp-scorecard.json
          {
            echo 'json<<JSON_EOF'
            cat /tmp/zkp-scorecard.json
            echo 'JSON_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zkp-scorecard
          path: /tmp/zkp-scorecard.json
          retention-days: 90

      - name: Post scorecard comment to tracking issue
        if: success()
        uses: actions/github-script@v7
        env:
          REPORT_JSON: ${{ steps.scorecard.outputs.json }}
        with:
          script: |
            const issueNumber = Number(process.env.ZKP_COST_SCORECARD_ISSUE)
            if (!Number.isFinite(issueNumber) || issueNumber <= 0) {
              core.warning(`ZKP_COST_SCORECARD_ISSUE=${process.env.ZKP_COST_SCORECARD_ISSUE} is not a valid issue number; skipping comment.`)
              return
            }
            const report = JSON.parse(process.env.REPORT_JSON)
            const { okCount, failCount, failRate, p50Ms, p95Ms } = report.totals
            const lines = [
              `### zkp_route_events scorecard — ${report.generatedAt.slice(0, 10)}`,
              '',
              `- Window: last ${report.windowDays} days`,
              `- ok: **${okCount}**  /  fail: **${failCount}**  /  fail-rate: **${(failRate * 100).toFixed(2)}%**`,
              `- p50: ${p50Ms ?? 'n/a'} ms  /  p95: ${p95Ms ?? 'n/a'} ms`,
              '',
              '<details><summary>Per-day breakdown</summary>',
              '',
              '| Day | ok | fail | fail% | p50 ms | p95 ms |',
              '|---|---:|---:|---:|---:|---:|',
              ...report.rows.map((r) => `| ${r.day} | ${r.okCount} | ${r.failCount} | ${(r.failRate * 100).toFixed(2)}% | ${r.p50Ms ?? 'n/a'} | ${r.p95Ms ?? 'n/a'} |`),
              '',
              '</details>',
              '',
              `_Generated by \`.github/workflows/zkp-cost-scorecard.yml\` — owner: [[s1-cost-drift]] memory note._`,
            ]
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: lines.join('\n'),
            })

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::zkp-cost-scorecard FAILED on ${GITHUB_RUN_ID}."
          echo "Workflow URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Origin: pattern_s1_phase_5_done.md §Wave 4 nice-to-have #8."
