name: mobile-e2e

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/ui/native/**'
      - 'packages/ui/theme/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile-e2e.yml'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Detox iOS
    runs-on: macos-14
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests + coverage
        working-directory: apps/mobile
        run: bun run test:coverage

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Expo prebuild (iOS)
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios --clean --non-interactive

      - name: Install Detox CLI
        run: bun add -g detox-cli

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew install applesimutils

      - name: Build iOS Detox bundle
        working-directory: apps/mobile
        run: bun run e2e:build:ios

      - name: Run iOS Detox tests
        working-directory: apps/mobile
        run: bun run test:e2e:ios -- --headless --record-logs all

      - name: Upload iOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detox-ios-artifacts
          path: apps/mobile/artifacts
          if-no-files-found: ignore

  android:
    name: Detox Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests + coverage
        working-directory: apps/mobile
        run: bun run test:coverage

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --clean --non-interactive

      - name: Install Detox CLI
        run: bun add -g detox-cli

      - name: Build Android Detox bundle
        working-directory: apps/mobile
        run: bun run e2e:build:android

      - name: Run Android Detox tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: Pixel_7_API_34
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/mobile
          script: bun run test:e2e:android -- --headless --record-logs all

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detox-android-artifacts
          path: apps/mobile/artifacts
          if-no-files-found: ignore
