<!doctype html>
<html lang="en" data-theme="light" data-screen-label="Factivist Web App">
<head>
  <meta charset="utf-8">
  <title>Factivist · Web UI kit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { height: 100%; }
    body { background: var(--color-background); }
    #root { min-height: 100vh; }
    .fv-app-grid {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 280px;
      gap: 28px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
      align-items: start;
    }
    @media (max-width: 1080px) {
      .fv-app-grid { grid-template-columns: minmax(0, 1fr); }
      .fv-app-grid > aside { display: none; }
    }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="layout.jsx"></script>
  <script type="text/babel" src="feed.jsx"></script>
  <script type="text/babel" src="submit.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const data = window.fvData;
      const [route, setRoute] = useState('feed'); // feed | detail | submit | profile | constituency | reports | chat
      const [activeCat, setActiveCat] = useState(null);

      const onNav = (r) => setRoute(r);
      const onOpen = (id) => setRoute('detail');

      const filtered = activeCat
        ? data.feed.filter(c => c.category.toLowerCase().includes(activeCat))
        : data.feed;

      const ToastBanner = route==='constituency' || route==='reports' || route==='chat' ? (
        <div style={{
          background:'var(--color-card)', border:'1px solid var(--color-border)',
          borderRadius:20, padding:48, textAlign:'center',
          color:'var(--color-muted-foreground)',
        }}>
          <div style={{ fontSize:18, fontWeight:600, color:'var(--color-foreground)', marginBottom:8 }}>
            {route==='constituency' && 'Constituency explorer'}
            {route==='reports' && 'Leader report cards'}
            {route==='chat' && 'Ask AI'}
          </div>
          <div style={{ fontSize:13 }}>
            Surface stubbed in the UI kit. See ProfileScreen for a report-card sample.
          </div>
        </div>
      ) : null;

      return (
        <>
          <Header active={route} onNav={onNav} me={data.me}/>
          {route==='submit' ? (
            <main style={{ maxWidth:1280, margin:'0 auto', padding:'24px' }}>
              <SubmitScreen
                categories={data.categories}
                onClose={()=>setRoute('feed')}
                onPublish={()=>setRoute('feed')}
              />
            </main>
          ) : route==='profile' ? (
            <main style={{ maxWidth:1280, margin:'0 auto', padding:'24px' }}>
              <ProfileScreen me={data.me} onClose={()=>setRoute('feed')}/>
            </main>
          ) : (
            <main className="fv-app-grid">
              <Sidebar categories={data.categories} activeCat={activeCat} onCat={setActiveCat}/>
              <div>
                {route==='feed' && <FeedScreen feed={filtered} onOpen={onOpen}/>}
                {route==='detail' && <DetailScreen c={data.detail} onBack={()=>setRoute('feed')}/>}
                {ToastBanner}
              </div>
              <RightRail trending={data.trending} me={data.me}/>
            </main>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
