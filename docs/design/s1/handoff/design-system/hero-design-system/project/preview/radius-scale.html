<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>radius-scale.html</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="fv-card">

<div class="fv-eyebrow">Radius scale</div>
<div class="fv-row" style="gap:16px; align-items:flex-end;">
  
    <div class="fv-col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:64px; background:var(--color-brand-100); border:1px solid var(--color-brand-300); border-radius:0px;"></div>
      <span class="fv-mono" style="font-size:10px;">none</span>
      <span class="fv-mono" style="font-size:10px; color:var(--color-muted-foreground);">0px</span>
    </div>
  
    <div class="fv-col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:64px; background:var(--color-brand-100); border:1px solid var(--color-brand-300); border-radius:4px;"></div>
      <span class="fv-mono" style="font-size:10px;">sm</span>
      <span class="fv-mono" style="font-size:10px; color:var(--color-muted-foreground);">4px</span>
    </div>
  
    <div class="fv-col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:64px; background:var(--color-brand-100); border:1px solid var(--color-brand-300); border-radius:6px;"></div>
      <span class="fv-mono" style="font-size:10px;">md</span>
      <span class="fv-mono" style="font-size:10px; color:var(--color-muted-foreground);">6px</span>
    </div>
  
    <div class="fv-col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:64px; background:var(--color-brand-100); border:1px solid var(--color-brand-300); border-radius:8px;"></div>
      <span class="fv-mono" style="font-size:10px;">lg</span>
      <span class="fv-mono" style="font-size:10px; color:var(--color-muted-foreground);">8px</span>
    </div>
  
    <div class="fv-col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:64px; background:var(--color-brand-100); border:1px solid var(--color-brand-300); border-radius:12px;"></div>
      <span class="fv-mono" style="font-size:10px;">xl</span>
      <span class="fv-mono" style="font-size:10px; color:var(--color-muted-foreground);">12px</span>
    </div>
  
    <div class="fv-col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:64px; background:var(--color-brand-100); border:1px solid var(--color-brand-300); border-radius:16px;"></div>
      <span class="fv-mono" style="font-size:10px;">2xl</span>
      <span class="fv-mono" style="font-size:10px; color:var(--color-muted-foreground);">16px</span>
    </div>
  
    <div class="fv-col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:64px; background:var(--color-brand-100); border:1px solid var(--color-brand-300); border-radius:24px;"></div>
      <span class="fv-mono" style="font-size:10px;">3xl</span>
      <span class="fv-mono" style="font-size:10px; color:var(--color-muted-foreground);">24px</span>
    </div>
  
    <div class="fv-col" style="align-items:center; gap:6px;">
      <div style="width:64px; height:64px; background:var(--color-brand-100); border:1px solid var(--color-brand-300); border-radius:9999px;"></div>
      <span class="fv-mono" style="font-size:10px;">full</span>
      <span class="fv-mono" style="font-size:10px; color:var(--color-muted-foreground);">999</span>
    </div>
  
</div>
</div></body></html>
