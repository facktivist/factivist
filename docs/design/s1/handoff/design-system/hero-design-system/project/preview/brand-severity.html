<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>brand-severity.html</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="fv-card">

<div class="fv-eyebrow">Severity scale · low → critical</div>
<div class="fv-row" style="gap:8px;">
  
    <span style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:var(--color-gray-200); color:var(--color-gray-800); border-radius:9999px; font-size:12px; font-weight:600; letter-spacing:0.02em;">
      <span style="width:8px;height:8px;border-radius:50%;background:currentColor;opacity:0.7;"></span>Low
    </span>
  
    <span style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:var(--color-warning-100); color:var(--color-warning-900); border-radius:9999px; font-size:12px; font-weight:600; letter-spacing:0.02em;">
      <span style="width:8px;height:8px;border-radius:50%;background:currentColor;opacity:0.7;"></span>Medium
    </span>
  
    <span style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:var(--color-warning-500); color:var(--color-gray-950); border-radius:9999px; font-size:12px; font-weight:600; letter-spacing:0.02em;">
      <span style="width:8px;height:8px;border-radius:50%;background:currentColor;opacity:0.7;"></span>High
    </span>
  
    <span style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:var(--color-danger-500); color:#ffffff; border-radius:9999px; font-size:12px; font-weight:600; letter-spacing:0.02em;">
      <span style="width:8px;height:8px;border-radius:50%;background:currentColor;opacity:0.7;"></span>Critical
    </span>
  
</div>
<div class="fv-eyebrow" style="margin-top:6px;">Moderation outcome</div>
<div class="fv-row" style="gap:8px;">
  <span style="padding:5px 10px; background:var(--color-success-100); color:var(--color-success-800); border-radius:9999px; font-size:12px; font-weight:600;">Pass</span><span style="padding:5px 10px; background:var(--color-warning-100); color:var(--color-warning-900); border-radius:9999px; font-size:12px; font-weight:600;">Review</span><span style="padding:5px 10px; background:var(--color-danger-100); color:var(--color-danger-800); border-radius:9999px; font-size:12px; font-weight:600;">Reject</span>
</div>
<div style="font-size:11px; color:var(--color-muted-foreground); line-height:1.5;">
  Severity ramps from neutral → warning → danger as urgency rises. Avoid red for routine status — reserve it for genuinely critical issues (mob violence, custodial death, child trafficking).
</div>
</div></body></html>
