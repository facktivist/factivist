<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>shadow-scale.html</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="fv-card">

<div class="fv-eyebrow">Elevation · drop shadows</div>
<div class="fv-row" style="gap:16px; padding:14px 6px;">
  
    <div class="fv-col" style="align-items:center; gap:8px;">
      <div style="width:84px; height:60px; background:var(--color-card); border:1px solid var(--color-border); border-radius:10px; box-shadow:var(--shadow-xs);"></div>
      <span class="fv-mono" style="font-size:10px;">shadow-xs</span>
    </div>
  
    <div class="fv-col" style="align-items:center; gap:8px;">
      <div style="width:84px; height:60px; background:var(--color-card); border:1px solid var(--color-border); border-radius:10px; box-shadow:var(--shadow-sm);"></div>
      <span class="fv-mono" style="font-size:10px;">shadow-sm</span>
    </div>
  
    <div class="fv-col" style="align-items:center; gap:8px;">
      <div style="width:84px; height:60px; background:var(--color-card); border:1px solid var(--color-border); border-radius:10px; box-shadow:var(--shadow-md);"></div>
      <span class="fv-mono" style="font-size:10px;">shadow-md</span>
    </div>
  
    <div class="fv-col" style="align-items:center; gap:8px;">
      <div style="width:84px; height:60px; background:var(--color-card); border:1px solid var(--color-border); border-radius:10px; box-shadow:var(--shadow-lg);"></div>
      <span class="fv-mono" style="font-size:10px;">shadow-lg</span>
    </div>
  
    <div class="fv-col" style="align-items:center; gap:8px;">
      <div style="width:84px; height:60px; background:var(--color-card); border:1px solid var(--color-border); border-radius:10px; box-shadow:var(--shadow-xl);"></div>
      <span class="fv-mono" style="font-size:10px;">shadow-xl</span>
    </div>
  
</div>
<div style="font-size:12px; color:var(--color-muted-foreground); line-height:1.5;">
  Black drop shadows at low opacity (0.04–0.10). Reserve xl for floating overlays (toasts, popovers); md is the default for cards.
</div>
</div></body></html>
